<div class="w-full space-y-8 pb-12 font-body text-on-surface">
  <header>
    <h1 class="mb-2 font-headline text-3xl font-extrabold tracking-tight text-[#003f87]">Settings</h1>
    <p class="font-medium text-slate-500">Manage your lecturer dashboard preferences</p>
  </header>

  <div class="flex flex-col gap-6 lg:flex-row lg:items-start lg:gap-8">
    <app-settings-tabs [activeTab]="activeTab()" (tabChange)="setTab($event)" />
    <div class="min-w-0 flex-1">
      @switch (activeTab()) {
        @case ('profile') {
          <app-profile-settings />
        }
        @case ('academic') {
          <app-academic-settings />
        }
        @case ('notifications') {
          <app-notification-settings />
        }
        @case ('security') {
          <app-security-settings />
        }
      }
    </div>
  </div>
</div>
