<!-- add/edit question page -->
<app-main-layout
  [pageTitle]="pageTitle()"
  breadcrumb="Question Bank > Question Editor"
  [showSearch]="false"
>
  <!-- show loading spinner while fetching question data -->
  @if (isLoading()) {
    <div class="py-20 flex justify-center">
      <app-loading-spinner size="lg" />
    </div>
  }

  <!-- show the form only when data is ready (or creating new) -->
  @if (!isLoading()) {
    <app-question-form
      [question]="question()"
      (formSubmit)="onFormSubmit($event)"
      (formCancel)="onFormCancel()"
    />
  }
</app-main-layout>
