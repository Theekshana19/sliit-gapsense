<!-- quiz builder page -->
<app-member-shell>
  <!-- quiz summary card on the right side -->
  <div class="grid grid-cols-12 gap-6">
    <!-- left side - quiz form wizard (8 cols) -->
    <div class="col-span-12 lg:col-span-8">
      <app-quiz-form [isSaving]="isSaving()" (formSubmit)="onQuizSubmit($event)" />
    </div>

    <!-- right side - summary and quick actions (4 cols) -->
    <div class="col-span-12 lg:col-span-4 space-y-5">
      <!-- quiz summary card - dark blue gradient -->
      <div class="bg-primary text-white p-8 rounded-2xl relative overflow-hidden">
        <!-- decorative circles -->
        <div class="absolute -top-6 -right-6 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>
        <div class="absolute -bottom-4 -left-4 w-16 h-16 bg-white/5 rounded-full blur-lg"></div>

        <h3 class="font-headline text-sm font-bold uppercase tracking-wider text-white/70 mb-4">Quiz Summary</h3>

        <div class="grid grid-cols-2 gap-4 mb-6">
          <div>
            <p class="text-3xl font-black">24</p>
            <p class="text-[10px] text-white/60 uppercase tracking-wider mt-1">Total Questions</p>
          </div>
          <div>
            <p class="text-3xl font-black">12</p>
            <p class="text-[10px] text-white/60 uppercase tracking-wider mt-1">Selected</p>
          </div>
          <div>
            <p class="text-3xl font-black">100</p>
            <p class="text-[10px] text-white/60 uppercase tracking-wider mt-1">Total Marks</p>
          </div>
          <div>
            <p class="text-3xl font-black">40</p>
            <p class="text-[10px] text-white/60 uppercase tracking-wider mt-1">Passing</p>
          </div>
        </div>

        <!-- difficulty distribution bar -->
        <div>
          <p class="text-[10px] text-white/60 uppercase tracking-wider mb-2">Difficulty Distribution</p>
          <div class="flex h-2 rounded-full overflow-hidden bg-white/20">
            <div class="bg-white w-[30%]" title="Easy 30%"></div>
            <div class="bg-primary-fixed w-[50%]" title="Medium 50%"></div>
            <div class="bg-error-container w-[20%]" title="Hard 20%"></div>
          </div>
          <div class="flex justify-between mt-1.5">
            <span class="text-[9px] text-white/50">Easy 30%</span>
            <span class="text-[9px] text-white/50">Medium 50%</span>
            <span class="text-[9px] text-white/50">Hard 20%</span>
          </div>
        </div>
      </div>

      <!-- quick actions card -->
      <div class="bg-surface-container-lowest p-5 rounded-xl shadow-sm">
        <h3 class="font-headline text-sm font-bold text-on-surface mb-3">Quick Actions</h3>
        <div class="space-y-2">
          <button class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg hover:bg-surface-container-low transition-colors">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-on-surface-variant" style="font-size: 18px;">visibility</span>
              <span class="text-sm text-on-surface">Preview Quiz</span>
            </div>
            <span class="material-symbols-outlined text-on-surface-variant" style="font-size: 16px;">chevron_right</span>
          </button>
          <button class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg hover:bg-surface-container-low transition-colors">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-on-surface-variant" style="font-size: 18px;">import_contacts</span>
              <span class="text-sm text-on-surface">Import from Excel</span>
            </div>
            <span class="material-symbols-outlined text-on-surface-variant" style="font-size: 16px;">chevron_right</span>
          </button>
          <button class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg hover:bg-surface-container-low transition-colors">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-on-surface-variant" style="font-size: 18px;">content_copy</span>
              <span class="text-sm text-on-surface">Duplicate Template</span>
            </div>
            <span class="material-symbols-outlined text-on-surface-variant" style="font-size: 16px;">chevron_right</span>
          </button>
        </div>
      </div>

      <!-- module info card -->
      <div class="bg-surface-container-lowest p-5 rounded-xl shadow-sm">
        <h3 class="font-headline text-sm font-bold text-on-surface mb-2">Module Info</h3>
        <p class="text-xs text-on-surface-variant">Software Quality Assurance</p>
        <div class="mt-3 space-y-1.5">
          <div class="flex justify-between text-xs">
            <span class="text-on-surface-variant">Batch</span>
            <span class="font-medium text-on-surface">Y3S2</span>
          </div>
          <div class="flex justify-between text-xs">
            <span class="text-on-surface-variant">Code</span>
            <span class="font-medium text-on-surface">IT4020</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-member-shell>
