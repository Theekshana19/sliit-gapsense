<!-- add/edit module page -->
<app-main-layout [pageTitle]="pageTitle()" breadcrumb="Curriculum > Module Editor" [showSearch]="false">
  @if (isLoading()) {
    <div class="py-20 flex justify-center">
      <app-loading-spinner size="lg" />
    </div>
  }
  @if (!isLoading()) {
    <app-module-form [module]="module()" (formSubmit)="onFormSubmit($event)" (formCancel)="onFormCancel()" />
  }
</app-main-layout>
