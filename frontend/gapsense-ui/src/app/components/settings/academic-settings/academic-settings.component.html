<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <h2 class="mb-1 font-headline text-lg font-bold text-[#003f87]">Academic</h2>
  <p class="mb-6 text-sm text-slate-500">Set your default semester, year, and module context.</p>

  <form class="space-y-5" (ngSubmit)="save()">
    <div>
      <label class="mb-1.5 block text-sm font-semibold text-slate-700" for="academic-semester">Semester</label>
      <select
        id="academic-semester"
        name="semester"
        [(ngModel)]="academic.semester"
        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20"
      >
        @for (opt of semesterOptions; track opt) {
          <option [value]="opt">{{ opt }}</option>
        }
      </select>
    </div>
    <div>
      <label class="mb-1.5 block text-sm font-semibold text-slate-700" for="academic-year">Academic Year</label>
      <select
        id="academic-year"
        name="academicYear"
        [(ngModel)]="academic.academicYear"
        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20"
      >
        @for (opt of yearOptions; track opt) {
          <option [value]="opt">{{ opt }}</option>
        }
      </select>
    </div>
    <div>
      <label class="mb-1.5 block text-sm font-semibold text-slate-700" for="academic-module">Default Module</label>
      <input
        id="academic-module"
        name="defaultModule"
        type="text"
        [(ngModel)]="academic.defaultModule"
        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20"
      />
    </div>
    <div>
      <label class="mb-1.5 block text-sm font-semibold text-slate-700" for="academic-faculty">Assigned Faculty</label>
      <input
        id="academic-faculty"
        name="assignedFaculty"
        type="text"
        [(ngModel)]="academic.assignedFaculty"
        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20"
      />
    </div>
    <div class="pt-2">
      <button
        type="submit"
        class="inline-flex items-center justify-center rounded-xl bg-[#003f87] px-5 py-2.5 text-sm font-bold text-white shadow-sm transition hover:brightness-110"
      >
        Save Changes
      </button>
    </div>
  </form>
</div>
