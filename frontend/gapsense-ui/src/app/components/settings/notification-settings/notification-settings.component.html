<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <h2 class="mb-1 font-headline text-lg font-bold text-[#003f87]">Notifications</h2>
  <p class="mb-6 text-sm text-slate-500">Choose how you want to be alerted in the dashboard.</p>

  <form class="space-y-4" (ngSubmit)="save()">
    <label
      class="flex cursor-pointer items-center justify-between gap-4 rounded-xl border border-slate-200 bg-slate-50/80 px-4 py-3 transition hover:bg-slate-50"
    >
      <span class="text-sm font-semibold text-slate-800">Email Alerts</span>
      <input
        type="checkbox"
        name="emailAlerts"
        [(ngModel)]="notifications.emailAlerts"
        class="h-5 w-5 rounded border-slate-300 text-[#003f87] focus:ring-[#003f87]"
      />
    </label>
    <label
      class="flex cursor-pointer items-center justify-between gap-4 rounded-xl border border-slate-200 bg-slate-50/80 px-4 py-3 transition hover:bg-slate-50"
    >
      <span class="text-sm font-semibold text-slate-800">Student Risk Alerts</span>
      <input
        type="checkbox"
        name="studentRiskAlerts"
        [(ngModel)]="notifications.studentRiskAlerts"
        class="h-5 w-5 rounded border-slate-300 text-[#003f87] focus:ring-[#003f87]"
      />
    </label>
    <label
      class="flex cursor-pointer items-center justify-between gap-4 rounded-xl border border-slate-200 bg-slate-50/80 px-4 py-3 transition hover:bg-slate-50"
    >
      <span class="text-sm font-semibold text-slate-800">Assignment Reminders</span>
      <input
        type="checkbox"
        name="assignmentReminders"
        [(ngModel)]="notifications.assignmentReminders"
        class="h-5 w-5 rounded border-slate-300 text-[#003f87] focus:ring-[#003f87]"
      />
    </label>
    <label
      class="flex cursor-pointer items-center justify-between gap-4 rounded-xl border border-slate-200 bg-slate-50/80 px-4 py-3 transition hover:bg-slate-50"
    >
      <span class="text-sm font-semibold text-slate-800">Weekly Reports</span>
      <input
        type="checkbox"
        name="weeklyReports"
        [(ngModel)]="notifications.weeklyReports"
        class="h-5 w-5 rounded border-slate-300 text-[#003f87] focus:ring-[#003f87]"
      />
    </label>
    <div class="pt-4">
      <button
        type="submit"
        [disabled]="loading || saving"
        class="inline-flex items-center justify-center rounded-xl bg-[#003f87] px-5 py-2.5 text-sm font-bold text-white shadow-sm transition hover:brightness-110"
      >
        {{ saving ? 'Saving...' : 'Save Changes' }}
      </button>
    </div>
  </form>
</div>
