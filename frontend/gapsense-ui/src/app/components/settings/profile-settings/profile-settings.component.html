<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <h2 class="mb-1 font-headline text-lg font-bold text-[#003f87]">Profile</h2>
  <p class="mb-6 text-sm text-slate-500">Update your contact details and department.</p>

  <form class="space-y-5" (ngSubmit)="save()">
    <div>
      <label class="mb-1.5 block text-sm font-semibold text-slate-700" for="profile-fullName">Full Name</label>
      <input
        id="profile-fullName"
        name="fullName"
        type="text"
        [(ngModel)]="profile.fullName"
        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20"
      />
    </div>
    <div>
      <label class="mb-1.5 block text-sm font-semibold text-slate-700" for="profile-email">Email</label>
      <input
        id="profile-email"
        name="email"
        type="email"
        [(ngModel)]="profile.email"
        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20"
      />
    </div>
    <div>
      <label class="mb-1.5 block text-sm font-semibold text-slate-700" for="profile-phone">Phone Number</label>
      <input
        id="profile-phone"
        name="phoneNumber"
        type="tel"
        [(ngModel)]="profile.phoneNumber"
        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20"
      />
    </div>
    <div>
      <label class="mb-1.5 block text-sm font-semibold text-slate-700" for="profile-dept">Department</label>
      <input
        id="profile-dept"
        name="department"
        type="text"
        [(ngModel)]="profile.department"
        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20"
      />
    </div>
    <div class="pt-2">
      <button
        type="submit"
        class="inline-flex items-center justify-center rounded-xl bg-[#003f87] px-5 py-2.5 text-sm font-bold text-white shadow-sm transition hover:brightness-110"
      >
        Save Changes
      </button>
    </div>
  </form>
</div>
