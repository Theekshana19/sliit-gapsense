<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <h2 class="mb-1 font-headline text-lg font-bold text-[#003f87]">Security</h2>
  <p class="mb-6 text-sm text-slate-500">Update your password and session security.</p>

  <form class="space-y-5" (ngSubmit)="save()">
    <div>
      <label class="mb-1.5 block text-sm font-semibold text-slate-700" for="sec-current">Current Password</label>
      <input
        id="sec-current"
        name="currentPassword"
        type="password"
        autocomplete="current-password"
        [(ngModel)]="security.currentPassword"
        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20"
      />
    </div>
    <div>
      <label class="mb-1.5 block text-sm font-semibold text-slate-700" for="sec-new">New Password</label>
      <input
        id="sec-new"
        name="newPassword"
        type="password"
        autocomplete="new-password"
        [(ngModel)]="security.newPassword"
        (ngModelChange)="passwordMismatch = false"
        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20"
      />
    </div>
    <div>
      <label class="mb-1.5 block text-sm font-semibold text-slate-700" for="sec-confirm">Confirm Password</label>
      <input
        id="sec-confirm"
        name="confirmPassword"
        type="password"
        autocomplete="new-password"
        [(ngModel)]="security.confirmPassword"
        (ngModelChange)="passwordMismatch = false"
        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-[#003f87] focus:ring-2 focus:ring-[#003f87]/20"
      />
    </div>
    @if (passwordMismatch) {
      <p class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-2 text-sm text-rose-700">
        New password and confirmation do not match.
      </p>
    }
    <label
      class="flex cursor-pointer items-center justify-between gap-4 rounded-xl border border-slate-200 bg-slate-50/80 px-4 py-3 transition hover:bg-slate-50"
    >
      <span class="text-sm font-semibold text-slate-800">Enable Two-Factor Authentication</span>
      <input
        type="checkbox"
        name="twoFactorEnabled"
        [(ngModel)]="security.twoFactorEnabled"
        class="h-5 w-5 rounded border-slate-300 text-[#003f87] focus:ring-[#003f87]"
      />
    </label>
    <div class="flex flex-col gap-3 pt-2 sm:flex-row sm:flex-wrap sm:items-center">
      <button
        type="submit"
        [disabled]="loading || saving"
        class="inline-flex items-center justify-center rounded-xl bg-[#003f87] px-5 py-2.5 text-sm font-bold text-white shadow-sm transition hover:brightness-110"
      >
        {{ saving ? 'Saving...' : 'Save Changes' }}
      </button>
      <button
        type="button"
        (click)="logoutAllDevices()"
        class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50"
      >
        Logout All Devices
      </button>
    </div>
  </form>
</div>
