<nav
  class="flex w-full flex-col gap-1 rounded-2xl border border-slate-200 bg-white p-2 shadow-sm lg:w-56"
  aria-label="Settings sections"
>
  @for (tab of tabs; track tab.id) {
    <button
      type="button"
      (click)="select(tab.id)"
      [ngClass]="{
        'bg-[#003f87] text-white shadow-md': activeTab === tab.id,
        'text-slate-600 hover:bg-slate-50': activeTab !== tab.id,
      }"
      class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left text-sm font-semibold transition-colors"
    >
      <span
        class="material-symbols-outlined text-[22px] leading-none"
        [ngClass]="{ 'text-white': activeTab === tab.id, 'text-slate-500': activeTab !== tab.id }"
        aria-hidden="true"
        >{{ tab.icon }}</span
      >
      {{ tab.label }}
    </button>
  }
</nav>
