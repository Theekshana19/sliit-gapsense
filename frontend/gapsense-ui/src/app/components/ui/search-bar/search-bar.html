<!-- search input with icon -->
<div class="relative">
  <!-- search icon -->
  <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">
    search
  </span>

  <!-- input field -->
  <input
    type="text"
    [placeholder]="placeholder()"
    [value]="searchText()"
    (input)="onInput($any($event.target).value)"
    class="w-full pl-10 pr-10 py-2.5 bg-surface-container-low rounded-xl text-sm text-on-surface
           placeholder:text-on-surface-variant/60 focus:outline-none focus:ring-2 focus:ring-primary/20
           transition-all"
  />

  <!-- clear button - only shows when there is text -->
  @if (searchText()) {
    <button
      (click)="clear()"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors"
    >
      <span class="material-symbols-outlined" style="font-size: 18px;">close</span>
    </button>
  }
</div>
