<div class="space-y-1.5">
  <label [for]="selectId()" class="block text-xs font-bold uppercase tracking-wide text-slate-600">{{ label() }}</label>
  <div class="relative">
    @if (icon()) {
      <span
        class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg pointer-events-none z-[1]"
        >{{ icon() }}</span
      >
    }
    <select
      [id]="selectId()"
      [formControl]="control()"
      class="w-full appearance-none rounded-xl border border-slate-200/90 bg-slate-50 py-3 pr-10 text-sm font-medium text-slate-900 focus:border-blue-800 focus:ring-2 focus:ring-blue-800/20 outline-none transition-shadow cursor-pointer"
      [class.pl-11]="icon()"
      [class.px-4]="!icon()">
      <option value="" disabled>{{ placeholder() }}</option>
      @for (opt of options(); track opt.id) {
        <option [value]="opt.id">{{ opt.label }}</option>
      }
    </select>
    <span
      class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none text-xl"
      >expand_more</span
    >
  </div>
  @if (control().invalid && control().touched && control().errors?.['required']) {
    <p class="text-xs font-semibold text-red-600">Please select an option.</p>
  }
</div>
