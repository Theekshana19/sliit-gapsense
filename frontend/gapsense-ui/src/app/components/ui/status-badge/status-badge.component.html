@if (status() === 'active') {
  <div class="flex items-center gap-1.5 text-primary-fixed-dim bg-primary/5 border border-primary/10 px-2 py-0.5 rounded-md w-fit">
    <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
    <span class="text-[10px] font-bold uppercase tracking-wide text-primary">Active</span>
  </div>
} @else {
  <div class="flex items-center gap-1.5 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded-md w-fit">
    <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
    <span class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Inactive</span>
  </div>
}
