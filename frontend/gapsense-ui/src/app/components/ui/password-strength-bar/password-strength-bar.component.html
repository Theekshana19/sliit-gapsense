<div class="space-y-2">
  <div class="flex items-center justify-between gap-2">
    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-600">{{ label() }}</span>
    <span class="text-xs font-bold text-blue-800">{{ statusText() }}</span>
  </div>
  <div class="flex gap-1">
    @for (i of [1, 2, 3, 4]; track i) {
      <div
        class="h-1.5 flex-1 rounded-full transition-colors"
        [class.bg-blue-800]="i <= segmentsFilled()"
        [class.bg-slate-200]="i > segmentsFilled()"></div>
    }
  </div>
  @if (hint()) {
    <p class="text-xs text-slate-500">{{ hint() }}</p>
  }
</div>
