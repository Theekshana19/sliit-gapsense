<button
  [type]="type()"
  [disabled]="disabled()"
  (click)="clicked.emit()"
  class="inline-flex items-center justify-center gap-2 w-full rounded-xl font-semibold text-sm py-3.5 px-6 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
  [class.bg-blue-800]="variant() === 'primary'"
  [class.text-white]="variant() === 'primary'"
  [class.shadow-md]="variant() === 'primary'"
  [class.hover:bg-blue-900]="variant() === 'primary'"
  [class.bg-slate-200]="variant() === 'secondary'"
  [class.text-slate-800]="variant() === 'secondary'"
  [class.hover:bg-slate-300]="variant() === 'secondary'"
  [class.bg-transparent]="variant() === 'ghost'"
  [class.text-slate-600]="variant() === 'ghost'"
  [class.hover:bg-slate-100]="variant() === 'ghost'"
  [class.w-auto]="variant() === 'ghost'">
  {{ label() }}
  @if (showArrow()) {
    <span class="material-symbols-outlined text-lg">arrow_forward</span>
  }
</button>
