<!-- modal overlay - only visible when isOpen is true -->
@if (isOpen()) {
  <!-- dark backdrop -->
  <div
    class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 page-transition"
    (click)="onBackdropClick()"
  >
    <!-- modal box - stop click from closing when clicking inside -->
    <div
      class="bg-surface-container-lowest rounded-2xl shadow-xl w-full max-w-lg"
      (click)="$event.stopPropagation()"
    >
      <!-- header -->
      <div class="flex items-center justify-between px-6 pt-6 pb-4">
        <h2 class="font-headline text-xl font-bold text-on-surface">{{ title() }}</h2>
        <button
          (click)="onClose()"
          class="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-surface-container-high transition-colors"
        >
          <span class="material-symbols-outlined text-on-surface-variant">close</span>
        </button>
      </div>

      <!-- body - content goes here via ng-content -->
      <div class="px-6 pb-6">
        <ng-content />
      </div>
    </div>
  </div>
}
