<div class="space-y-1.5">
  @if (label()) {
    <label [for]="inputId()" class="block text-xs font-bold uppercase tracking-wide text-slate-600">{{ label() }}</label>
  }
  <div class="relative">
    @if (icon()) {
      <span
        class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg pointer-events-none"
        >{{ icon() }}</span
      >
    }
    <input
      [id]="inputId()"
      [type]="visible() ? 'text' : 'password'"
      [placeholder]="placeholder()"
      [autocomplete]="autocomplete()"
      [formControl]="control()"
      class="w-full rounded-xl border border-slate-200/90 bg-slate-50 py-3 pr-11 text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:border-blue-800 focus:ring-2 focus:ring-blue-800/20 outline-none transition-shadow pl-11" />
    <button
      type="button"
      class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-slate-500 hover:bg-slate-200/80 transition-colors"
      (click)="toggle()"
      [attr.aria-label]="visible() ? 'Hide password' : 'Show password'">
      <span class="material-symbols-outlined text-lg">{{ visible() ? 'visibility_off' : 'visibility' }}</span>
    </button>
  </div>
  @if (control().invalid && control().touched) {
    @if (control().errors?.['required']) {
      <p class="text-xs font-semibold text-red-600">This field is required.</p>
    }
    @if (control().errors?.['minlength']) {
      <p class="text-xs font-semibold text-red-600">At least {{ control().errors?.['minlength'].requiredLength }} characters.</p>
    }
  }
</div>
