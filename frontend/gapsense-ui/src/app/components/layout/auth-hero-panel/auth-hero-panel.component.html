<div
  class="relative h-full min-h-[320px] lg:min-h-0 rounded-2xl lg:rounded-none lg:rounded-l-3xl overflow-hidden flex flex-col p-8 md:p-12 text-white"
  [class.bg-gradient-to-br]="true"
  [class.from-blue-900]="tone() === 'deep'"
  [class.to-blue-950]="tone() === 'deep'"
  [class.from-blue-800]="tone() === 'mid'"
  [class.to-blue-900]="tone() === 'mid'">
  <div
    class="absolute inset-0 opacity-[0.07] pointer-events-none"
    style="
      background-image: linear-gradient(90deg, #fff 1px, transparent 1px), linear-gradient(#fff 1px, transparent 1px);
      background-size: 24px 24px;
    "></div>
  <div class="relative z-10 flex flex-col flex-1">
    <ng-content />
  </div>
</div>
