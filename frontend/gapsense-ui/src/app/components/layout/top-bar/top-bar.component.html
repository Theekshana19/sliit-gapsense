<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl shadow-sm flex justify-between items-center px-8 h-16 w-full">
  <div class="flex items-center gap-8">
    <span class="text-xl font-extrabold tracking-tight text-blue-900">SLIIT GapSense</span>
    <nav class="hidden md:flex items-center gap-6">
      @if (canManage()) {
        <a routerLink="/risk-thresholds" routerLinkActive="text-blue-700 border-b-2 border-blue-700 font-bold" [routerLinkActiveOptions]="{exact: true}"
           class="text-slate-500 hover:text-blue-600 text-sm font-medium pb-1 border-b-2 border-transparent">Dashboard</a>
        <a routerLink="/risk-thresholds"
           class="text-sm font-medium pb-1 border-b-2 transition-colors hover:text-blue-600"
           [class.text-blue-700]="isAnalysisRoute()"
           [class.border-blue-700]="isAnalysisRoute()"
           [class.font-bold]="isAnalysisRoute()"
           [class.text-slate-500]="!isAnalysisRoute()"
           [class.border-transparent]="!isAnalysisRoute()">Analysis</a>
      } @else {
        <a routerLink="/readiness-results" routerLinkActive="text-blue-700 border-b-2 border-blue-700 font-bold" [routerLinkActiveOptions]="{exact: true}"
           class="text-slate-500 hover:text-blue-600 text-sm font-medium pb-1 border-b-2 border-transparent">Home</a>
        <a routerLink="/weak-topic-analysis"
           class="text-sm font-medium pb-1 border-b-2 transition-colors hover:text-blue-600"
           [class.text-blue-700]="isAnalysisRoute()"
           [class.border-blue-700]="isAnalysisRoute()"
           [class.font-bold]="isAnalysisRoute()"
           [class.text-slate-500]="!isAnalysisRoute()"
           [class.border-transparent]="!isAnalysisRoute()">Analysis</a>
      }
      <a routerLink="/risk-trends" routerLinkActive="text-blue-700 border-b-2 border-blue-700 font-bold"
         class="text-slate-500 hover:text-blue-600 text-sm font-medium pb-1 border-b-2 border-transparent">Reports</a>
    </nav>
  </div>
  <div class="flex items-center gap-4">
    <div class="relative hidden sm:block">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
      <input class="bg-slate-100 border-none rounded-full py-2 pl-10 pr-4 text-sm w-64 focus:ring-2 focus:ring-blue-600" placeholder="Search insights..." type="text" />
    </div>
    <button class="p-2 hover:bg-slate-50 rounded-full transition-colors" type="button">
      <span class="material-symbols-outlined text-slate-600">notifications</span>
    </button>
    @if (!authUi.hasToken()) {
      <a
        routerLink="/auth/login"
        class="inline-flex text-xs sm:text-sm font-semibold text-blue-800 px-2.5 sm:px-3 py-2 rounded-lg hover:bg-blue-50 transition-colors">
        Login
      </a>
      <a
        routerLink="/auth/signup"
        class="inline-flex text-xs sm:text-sm font-semibold text-white bg-blue-800 px-2.5 sm:px-3 py-2 rounded-lg hover:bg-blue-900 transition-colors shadow-sm">
        Sign Up
      </a>
    } @else {
      <div class="relative">
        <button class="p-1 hover:bg-slate-50 rounded-full transition-colors" type="button" (click)="toggleMenu()">
          @if (profileImageUrl(); as imageUrl) {
            <img [src]="imageUrl" alt="Profile" class="w-9 h-9 rounded-full object-cover border border-slate-200" />
          } @else {
            <span class="material-symbols-outlined text-3xl text-slate-600">account_circle</span>
          }
        </button>
        @if (menuOpen) {
          <div class="absolute right-0 mt-2 w-64 bg-white border border-slate-200 rounded-xl shadow-lg p-3 z-50">
            <p class="text-sm font-semibold text-slate-900">{{ authUi.currentUser()?.fullName || 'User' }}</p>
            <p class="text-xs text-slate-600 mt-0.5">{{ authUi.currentUser()?.email }}</p>
            <div class="mt-3 border-t border-slate-200 pt-2 flex flex-col gap-1">
              <a
                routerLink="/profile"
                class="px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100"
                (click)="closeMenu()">
                Manage Profile
              </a>
              <button
                type="button"
                class="px-3 py-2 rounded-lg text-left text-sm font-medium text-red-700 hover:bg-red-50"
                (click)="logout()">
                Logout
              </button>
            </div>
          </div>
        }
      </div>
    }
  </div>
</header>
