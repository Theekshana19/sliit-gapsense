<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl shadow-sm flex justify-between items-center px-8 h-16 w-full">
  <div class="flex items-center gap-8">
    <span class="text-xl font-extrabold tracking-tight text-blue-900">SLIIT GapSense</span>
    <nav class="hidden md:flex items-center gap-6">
      <a routerLink="/dashboard" routerLinkActive="text-blue-700 border-b-2 border-blue-700 font-bold" [routerLinkActiveOptions]="{exact: true}"
         class="text-slate-500 hover:text-blue-600 text-sm font-medium">Dashboard</a>
      <a routerLink="/risk-thresholds"
         class="text-sm font-medium pb-1 border-b-2 transition-colors hover:text-blue-600"
         [class.text-blue-700]="isAnalysisRoute()"
         [class.border-blue-700]="isAnalysisRoute()"
         [class.font-bold]="isAnalysisRoute()"
         [class.text-slate-500]="!isAnalysisRoute()"
         [class.border-transparent]="!isAnalysisRoute()">Analysis</a>
      <a routerLink="/reports" routerLinkActive="text-blue-700 border-b-2 border-blue-700 font-bold"
         class="text-slate-500 hover:text-blue-600 text-sm font-medium">Reports</a>
    </nav>
  </div>
  <div class="flex items-center gap-4">
    <a
      routerLink="/auth/login"
      class="inline-flex text-xs sm:text-sm font-semibold text-blue-800 px-2.5 sm:px-3 py-2 rounded-lg hover:bg-blue-50 transition-colors">
      Login
    </a>
    <a
      routerLink="/auth/signup"
      class="inline-flex text-xs sm:text-sm font-semibold text-white bg-blue-800 px-2.5 sm:px-3 py-2 rounded-lg hover:bg-blue-900 transition-colors shadow-sm">
      Sign Up
    </a>
    <div class="relative hidden sm:block">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
      <input class="bg-slate-100 border-none rounded-full py-2 pl-10 pr-4 text-sm w-64 focus:ring-2 focus:ring-blue-600" placeholder="Search insights..." type="text" />
    </div>
    <button class="p-2 hover:bg-slate-50 rounded-full transition-colors" type="button">
      <span class="material-symbols-outlined text-slate-600">notifications</span>
    </button>
    <button class="p-2 hover:bg-slate-50 rounded-full transition-colors" type="button">
      <span class="material-symbols-outlined text-slate-600">account_circle</span>
    </button>
  </div>
</header>
