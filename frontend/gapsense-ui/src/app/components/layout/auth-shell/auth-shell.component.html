<div class="min-h-screen flex flex-col bg-slate-50">
  <app-auth-header [layout]="headerLayout()" [stepLabel]="stepLabel()" />
  @if (authUi.flashMessage()) {
    <div
      class="mx-6 md:mx-10 mt-4 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-900 flex items-center justify-between gap-3">
      <span>{{ authUi.flashMessage() }}</span>
      <button type="button" class="p-1 rounded-lg hover:bg-emerald-100 shrink-0" (click)="dismissFlash()">
        <span class="material-symbols-outlined text-lg">close</span>
      </button>
    </div>
  }
  <div class="flex-1 flex flex-col">
    <ng-content />
  </div>
  <app-auth-footer [variant]="footerVariant()" />
</div>
