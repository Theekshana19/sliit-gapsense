<header
  class="shrink-0 bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-6 md:px-10 py-4 flex flex-wrap items-center justify-between gap-4">
  <a routerLink="/" class="text-xl font-extrabold tracking-tight text-blue-900 font-headline">SLIIT GapSense</a>

  @switch (layout()) {
    @case ('slim') {
      @if (stepLabel()) {
        <div class="flex items-center gap-3 text-sm text-slate-600 ml-auto">
          <span class="font-semibold">{{ stepLabel() }}</span>
          <div class="h-1.5 w-32 rounded-full bg-slate-200 overflow-hidden hidden sm:block">
            <div class="h-full w-[85%] rounded-full bg-blue-800"></div>
          </div>
        </div>
      }
    }
    @case ('login') {
      <a
        routerLink="/auth/signup"
        class="text-sm font-semibold text-blue-800 hover:underline ml-auto">
        Sign Up
      </a>
    }
    @case ('signup-landing') {
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
        <a class="hover:text-blue-800 transition-colors" href="#">About</a>
        <a class="hover:text-blue-800 transition-colors" href="#">Support</a>
        <a class="hover:text-blue-800 transition-colors" href="#">Institutional Portal</a>
      </nav>
      <a routerLink="/auth/login" class="text-sm font-semibold text-blue-800 hover:underline ml-auto md:ml-0">
        Sign In
      </a>
    }
    @default {
      <nav class="hidden sm:flex items-center gap-6 text-sm font-medium text-slate-600">
        <a class="hover:text-blue-800 transition-colors" href="#">Programs</a>
        <a class="hover:text-blue-800 transition-colors" href="#">About</a>
        <a class="hover:text-blue-800 transition-colors" href="#">Support</a>
      </nav>
      <div class="flex items-center gap-3 ml-auto sm:ml-0">
        <a
          routerLink="/auth/login"
          class="text-sm font-semibold text-blue-800 px-4 py-2 rounded-lg hover:bg-blue-50 transition-colors">
          Login
        </a>
        <a
          routerLink="/auth/signup"
          class="text-sm font-semibold text-white bg-blue-800 px-4 py-2 rounded-lg hover:bg-blue-900 transition-colors shadow-sm">
          Sign Up
        </a>
      </div>
    }
  }
</header>
