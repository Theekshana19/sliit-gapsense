<div
  class="absolute right-0 top-full z-[100] mt-2 w-[min(100vw-2rem,400px)] overflow-hidden rounded-2xl border border-slate-200/90 bg-white shadow-lg shadow-slate-200/80 ring-1 ring-slate-100"
  role="dialog"
  aria-label="Notifications panel"
  (click)="$event.stopPropagation()"
>
  <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3">
    <h2 class="font-headline text-base font-bold text-[#003f87]">Notifications</h2>
    <button
      type="button"
      (click)="markAllRead()"
      class="text-xs font-semibold text-[#003f87] underline-offset-2 hover:underline"
    >
      Mark all as read
    </button>
  </div>

  <div class="max-h-[min(70vh,420px)] overflow-y-auto overscroll-contain [scrollbar-gutter:stable]">
    @if (!hasAny()) {
      <div class="px-6 py-12 text-center">
        <span class="material-symbols-outlined mb-2 text-4xl text-slate-300">notifications_off</span>
        <p class="text-sm font-medium text-slate-500">No notifications yet</p>
        <p class="mt-1 text-xs text-slate-400">Alerts and updates will appear here.</p>
      </div>
    } @else {
      <ul class="divide-y divide-slate-100 py-1">
        @for (n of recent(); track n.id) {
          <li class="px-2">
            <app-notification-item [item]="n" [compact]="true" />
          </li>
        }
      </ul>
    }
  </div>

  <div class="border-t border-slate-100 bg-slate-50/80 px-3 py-2.5">
    <a
      routerLink="/notifications"
      (click)="dismiss()"
      class="flex w-full items-center justify-center rounded-xl py-2 text-sm font-bold text-[#003f87] transition hover:bg-white"
    >
      View all notifications
    </a>
  </div>
</div>
