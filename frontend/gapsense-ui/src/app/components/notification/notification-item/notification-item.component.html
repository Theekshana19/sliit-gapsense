<button
  type="button"
  (click)="onActivate()"
  [ngClass]="{
    'w-full text-left': true,
    'rounded-xl border border-transparent px-3 py-2.5 transition hover:bg-slate-50': compact,
    'rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition hover:border-slate-300 hover:shadow': !compact,
  }"
  class="group flex gap-3"
>
  <div
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl"
    [ngClass]="iconBgClass()"
  >
    <span class="material-symbols-outlined text-[22px] leading-none">{{ iconForType() }}</span>
  </div>
  <div class="min-w-0 flex-1">
    <div class="flex items-start justify-between gap-2">
      <p
        class="font-semibold leading-snug text-slate-900"
        [class.text-[#003f87]]="!item.read"
        [class.font-bold]="!item.read"
      >
        {{ item.title }}
      </p>
      @if (!item.read) {
        <span
          class="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-[#003f87]"
          aria-hidden="true"
        ></span>
      }
    </div>
    <p class="mt-0.5 line-clamp-2 text-sm text-slate-600">{{ item.message }}</p>
    <p class="mt-1 text-xs font-medium text-slate-400">{{ item.time }}</p>
  </div>
</button>
