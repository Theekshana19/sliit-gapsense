<div class="bg-white p-8 rounded-xl border border-slate-200/80 shadow-sm">
  <div class="flex justify-between items-center mb-10">
    <h3 class="text-xl font-bold text-slate-900">Topic Proficiency Comparison</h3>
    <div class="flex gap-4">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-slate-300"></span>
        <span class="text-xs font-semibold text-slate-600">Attempt 1</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-blue-800"></span>
        <span class="text-xs font-semibold text-slate-600">Reassessment</span>
      </div>
    </div>
  </div>
  <div class="space-y-8">
    @for (item of items(); track item.topicName) {
      <div>
        <div class="flex justify-between text-xs font-bold text-slate-600 uppercase tracking-widest mb-3">
          <span>{{ item.topicName }}</span>
          <span class="text-blue-800">{{ item.growthText }}</span>
        </div>
        <div class="flex flex-col gap-1.5">
          <div class="w-full bg-slate-200 h-6 rounded-md relative overflow-hidden">
            <div class="bg-slate-300 h-full" [style.width.%]="item.attempt1Percent"></div>
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-slate-600">{{ item.attempt1Percent }}%</span>
          </div>
          <div class="w-full bg-slate-200 h-6 rounded-md relative overflow-hidden">
            <div class="bg-blue-800 h-full" [style.width.%]="item.reassessmentPercent"></div>
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-white">{{ item.reassessmentPercent }}%</span>
          </div>
        </div>
      </div>
    }
  </div>
</div>
