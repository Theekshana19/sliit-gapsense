<div class="flex flex-wrap items-center gap-4 bg-slate-100 rounded-xl px-6 py-4 border border-slate-200/60">
  <div class="flex flex-col gap-1.5">
    <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500 px-1">Module</label>
    <div class="relative">
      <select
        class="appearance-none bg-white border-0 rounded-lg px-4 py-2 pr-10 text-sm font-semibold text-slate-900 focus:ring-2 focus:ring-blue-800 min-w-[180px] cursor-pointer"
        [value]="svc.moduleId()"
        (change)="onModuleChange($any($event.target).value)">
        @for (m of svc.moduleOptions; track m.id) {
          <option [value]="m.id">{{ m.label }}</option>
        }
      </select>
      <span class="material-symbols-outlined absolute right-3 top-2 text-slate-500 pointer-events-none text-base">expand_more</span>
    </div>
  </div>
  <div class="flex flex-col gap-1.5">
    <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500 px-1">Batch</label>
    <div class="relative">
      <select
        class="appearance-none bg-white border-0 rounded-lg px-4 py-2 pr-10 text-sm font-semibold text-slate-900 focus:ring-2 focus:ring-blue-800 min-w-[140px] cursor-pointer"
        [value]="svc.batchId()"
        (change)="onBatchChange($any($event.target).value)">
        @for (b of svc.batchOptions; track b.id) {
          <option [value]="b.id">{{ b.label }}</option>
        }
      </select>
      <span class="material-symbols-outlined absolute right-3 top-2 text-slate-500 pointer-events-none text-base">expand_more</span>
    </div>
  </div>
  <div class="flex flex-col gap-1.5">
    <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500 px-1">Semester</label>
    <div class="relative">
      <select
        class="appearance-none bg-white border-0 rounded-lg px-4 py-2 pr-10 text-sm font-semibold text-slate-900 focus:ring-2 focus:ring-blue-800 min-w-[120px] cursor-pointer"
        [value]="svc.semesterId()"
        (change)="onSemesterChange($any($event.target).value)">
        @for (s of svc.semesterOptions; track s.id) {
          <option [value]="s.id">{{ s.label }}</option>
        }
      </select>
      <span class="material-symbols-outlined absolute right-3 top-2 text-slate-500 pointer-events-none text-base">expand_more</span>
    </div>
  </div>
  <button
    type="button"
    class="ml-auto flex items-center gap-2 text-blue-800 text-sm font-semibold hover:underline"
    (click)="advancedFilters.emit()">
    <span class="material-symbols-outlined text-lg">tune</span>
    Advanced Filters
  </button>
</div>
