<div class="p-8 bg-slate-100 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-6 border border-slate-200/60">
  <div>
    <h3 class="text-xl font-bold text-slate-900">{{ config().title }}</h3>
    <p class="text-slate-600 text-sm mt-1 font-medium">{{ config().subtitle }}</p>
  </div>
  <div class="flex gap-4 shrink-0">
    <button
      type="button"
      class="px-6 py-3 bg-slate-200 text-slate-900 font-bold rounded-xl hover:bg-slate-300 transition-colors"
      (click)="downloadPdf.emit()">
      {{ config().secondaryButtonLabel }}
    </button>
    <button
      type="button"
      class="px-6 py-3 bg-blue-800 text-white font-bold rounded-xl hover:shadow-lg transition-all"
      (click)="retakeTest.emit()">
      {{ config().primaryButtonLabel }}
    </button>
  </div>
</div>
