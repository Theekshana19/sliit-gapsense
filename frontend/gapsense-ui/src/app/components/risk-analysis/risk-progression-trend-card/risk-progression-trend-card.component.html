<div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200/80">
  <div class="mb-6">
    <h3 class="text-xl font-bold text-slate-900">{{ title() }}</h3>
    <p class="text-sm text-slate-600 mt-0.5">{{ subtitle() }}</p>
  </div>
  <div class="relative h-64">
    <svg class="w-full h-full" viewBox="0 0 400 200" preserveAspectRatio="none">
      @let curr = currentCohortPoints();
      @if (curr.length) {
        <path
          fill="none"
          stroke="#94a3b8"
          stroke-width="2"
          stroke-dasharray="6 4"
          [attr.d]="previousPath()"
          vector-effect="non-scaling-stroke" />
        <path
          fill="url(#riskProgressionGradient)"
          stroke="#1e3a5f"
          stroke-width="2"
          [attr.d]="currentPath()"
          vector-effect="non-scaling-stroke" />
      }
      <defs>
        <linearGradient id="riskProgressionGradient" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0" />
        </linearGradient>
      </defs>
    </svg>
    <div
      class="absolute bg-white rounded-lg shadow-lg border border-slate-200 p-3 -translate-x-1/2"
      [style.left.%]="peakMarkerLeftPercent()"
      style="top: 0;">
      <p class="text-[10px] font-bold text-slate-500 uppercase">{{ peakMarker().label }}</p>
      <p class="text-xl font-extrabold text-blue-800">{{ peakMarker().value }}</p>
      <p class="text-xs text-slate-600">{{ peakMarker().detail }}</p>
    </div>
  </div>
  <div class="flex justify-between mt-4 gap-2">
    @for (p of currentCohortPoints(); track p.month) {
      <span class="text-xs font-bold text-slate-600 flex-1 text-center">{{ p.month }}</span>
    }
  </div>
  <div class="flex gap-6 mt-4 pt-4 border-t border-slate-200">
    <div class="flex items-center gap-2">
      <span class="w-4 h-0.5 bg-blue-800"></span>
      <span class="text-xs font-semibold text-slate-700">Current cohort</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="w-4 h-0.5 bg-slate-400 border-dashed border-t-2 border-slate-400"></span>
      <span class="text-xs font-semibold text-slate-700">Previous cohort</span>
    </div>
  </div>
</div>
