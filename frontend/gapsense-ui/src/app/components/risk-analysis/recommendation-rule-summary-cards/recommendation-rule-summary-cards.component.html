<section class="mb-8 grid grid-cols-1 md:grid-cols-3 gap-6">
  <div
    class="bg-gradient-to-br from-blue-800 to-blue-700 p-6 rounded-2xl text-white flex flex-col justify-between min-h-[10rem] shadow-xl">
    <span class="text-xs font-bold uppercase tracking-widest opacity-80">Active Impact</span>
    <h4 class="text-3xl font-extrabold">{{ activeImpact() | number }}</h4>
    <p class="text-[11px] font-medium leading-tight opacity-95">
      Students currently assigned recommendations via active rules.
    </p>
  </div>
  <div
    class="bg-white p-6 rounded-2xl flex flex-col justify-between min-h-[10rem] shadow-sm border border-slate-100">
    <div class="flex items-center justify-between">
      <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">Efficiency Rate</span>
      <span class="material-symbols-outlined text-blue-800">auto_graph</span>
    </div>
    <h4 class="text-3xl font-extrabold text-slate-900">{{ efficiencyRate().toFixed(1) }}%</h4>
    <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
      <div class="bg-blue-800 h-full rounded-full transition-all" [style.width.%]="efficiencyRate()"></div>
    </div>
  </div>
  <div
    class="bg-white p-6 rounded-2xl flex flex-col justify-between min-h-[10rem] shadow-sm border border-red-100/80">
    <div class="flex items-center justify-between">
      <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">Critical Gaps</span>
      <span class="material-symbols-outlined text-red-600">warning</span>
    </div>
    <h4 class="text-3xl font-extrabold text-slate-900">{{ criticalGaps() }}</h4>
    <p class="text-[11px] font-medium text-slate-600">
      Topics currently lacking automated recommendation rules.
    </p>
  </div>
</section>
