@if (visible()) {
  <div class="mb-10 p-5 bg-red-50 border border-red-100 rounded-2xl flex items-start gap-4">
    <span class="material-symbols-outlined text-red-700 mt-0.5">warning</span>
    <div class="flex-1">
      <p class="text-sm font-extrabold text-red-900">Potential Rule Conflict</p>
      <p class="text-xs text-red-800/90 mt-1 font-medium leading-relaxed">{{ message() }}</p>
    </div>
    <button type="button" class="text-red-400 hover:text-red-800 p-1 rounded-lg transition-colors" (click)="dismiss.emit()">
      <span class="material-symbols-outlined text-lg">close</span>
    </button>
  </div>
}
