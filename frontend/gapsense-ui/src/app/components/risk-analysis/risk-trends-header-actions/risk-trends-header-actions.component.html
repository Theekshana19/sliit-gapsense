<div class="flex gap-3">
  <button
    type="button"
    class="inline-flex items-center gap-2 px-6 py-2.5 bg-slate-200/90 text-slate-900 font-semibold rounded-xl hover:bg-slate-300/90 transition-colors text-sm"
    (click)="exportPdf.emit()">
    <span class="material-symbols-outlined text-lg">download</span>
    Export PDF
  </button>
  <button
    type="button"
    class="inline-flex items-center gap-2 px-6 py-2.5 bg-blue-800 text-white font-semibold rounded-xl shadow-md hover:opacity-90 transition-all text-sm"
    (click)="shareInsight.emit()">
    <span class="material-symbols-outlined text-lg">share</span>
    Share Insight
  </button>
</div>
