<div class="flex gap-3">
  <button
    type="button"
    class="inline-flex items-center gap-2 px-4 py-2.5 bg-slate-200/90 text-slate-900 font-semibold rounded-xl hover:bg-slate-300/90 transition-colors text-sm"
    (click)="filter.emit()">
    <span class="material-symbols-outlined text-lg">filter_list</span>
    Filter
  </button>
  <button
    type="button"
    class="inline-flex items-center gap-2 px-5 py-2.5 bg-blue-800 text-white font-semibold rounded-xl shadow-md hover:opacity-90 transition-all text-sm"
    (click)="generateNew.emit()">
    <span class="material-symbols-outlined text-lg">refresh</span>
    Generate New
  </button>
</div>
