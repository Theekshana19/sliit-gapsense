<div class="grid grid-cols-12 gap-6">
  <div class="col-span-12 md:col-span-4 bg-white p-6 rounded-xl shadow-sm relative overflow-hidden group border border-slate-100">
    <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:scale-110 transition-transform duration-500">
      <span class="material-symbols-outlined text-6xl text-blue-700">analytics</span>
    </div>
    <p class="text-slate-600 text-sm font-semibold mb-1">Active Rules</p>
    <h3 class="text-4xl font-extrabold text-blue-700">{{ activeCount() }}</h3>
    <div class="mt-4 flex items-center gap-1 text-xs font-medium text-blue-700">
      <span class="material-symbols-outlined text-sm">trending_up</span>
      <span>{{ totalCount() }} global thresholds</span>
    </div>
  </div>
  <div class="col-span-12 md:col-span-5 bg-white p-6 rounded-xl shadow-sm relative overflow-hidden group border border-slate-100">
    <p class="text-slate-600 text-sm font-semibold mb-4">Global Thresholds</p>
    <div class="flex items-center gap-4">
      <div class="flex-1">
        <div class="flex justify-between mb-1 text-xs font-bold">
          <span class="text-red-600">High Risk</span>
          <span>{{ highRiskLabel() }}</span>
        </div>
        <div class="w-full bg-slate-100 h-1.5 rounded-full">
          <div class="bg-red-500 h-1.5 rounded-full" [style.width.%]="highRiskPercent()"></div>
        </div>
      </div>
      <div class="flex-1">
        <div class="flex justify-between mb-1 text-xs font-bold">
          <span class="text-blue-700">Low Risk</span>
          <span>{{ lowRiskLabel() }}</span>
        </div>
        <div class="w-full bg-slate-100 h-1.5 rounded-full">
          <div class="bg-blue-600 h-1.5 rounded-full" [style.width.%]="lowRiskPercent()"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-span-12 md:col-span-3 bg-slate-50 p-6 rounded-xl flex flex-col justify-center border border-slate-100">
    <p class="text-slate-600 text-sm font-semibold mb-1">Last Updated</p>
    <h3 class="text-lg font-bold text-slate-900">{{ lastUpdated() }}</h3>
    <p class="text-xs font-medium text-slate-500 mt-1">Updated by {{ lastUpdatedBy() }}</p>
  </div>
</div>
