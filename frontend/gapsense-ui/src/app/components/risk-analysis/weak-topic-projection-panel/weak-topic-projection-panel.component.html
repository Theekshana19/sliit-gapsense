<div class="bg-slate-900 p-8 rounded-xl shadow-lg border border-slate-800 text-white h-full flex flex-col">
  <h4 class="text-xl font-bold mb-2">Topic Trend Projection</h4>
  <p class="text-slate-400 text-sm mb-6">{{ projection().subtitle }}</p>
  <div class="flex items-end gap-2 h-32 mb-2 flex-1 min-h-[8rem]">
    @for (bar of projection().bars; track bar.label) {
      <div class="flex-1 flex flex-col justify-end h-full">
        <div
          class="w-full rounded-t-lg transition-all relative group/bar"
          [class]="barClass(bar.variant)"
          [style.height.%]="bar.heightPercent"></div>
      </div>
    }
  </div>
  <div class="flex justify-between text-[10px] font-bold text-slate-500 uppercase tracking-wider gap-1">
    @for (bar of projection().bars; track bar.label) {
      <span [class.text-blue-200]="bar.variant === 'projection'">{{ bar.label }}</span>
    }
  </div>
  <div class="mt-6 flex items-start gap-3 p-4 bg-white/5 rounded-lg border border-white/10">
    <span class="material-symbols-outlined text-blue-200 shrink-0">rocket_launch</span>
    <p class="text-xs text-slate-300 leading-relaxed">
      @let parts = insightParts();
      {{ parts.before }}<span class="text-white font-bold">{{ parts.highlight }}%</span>{{ parts.after }}
    </p>
  </div>
</div>
