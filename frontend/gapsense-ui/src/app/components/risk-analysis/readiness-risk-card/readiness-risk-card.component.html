<div
  class="bg-white rounded-xl p-8 flex flex-col justify-between min-h-[220px] border border-slate-200/80 shadow-sm">
  <div class="flex justify-between items-start">
    <span class="text-slate-600 font-semibold text-sm uppercase tracking-wider">Risk Assessment</span>
    <span class="material-symbols-outlined text-lg" [class]="iconClass()">report_problem</span>
  </div>
  <div class="mt-4">
    <div
      class="inline-flex items-center gap-2 px-4 py-2 rounded-full font-bold text-lg mb-2"
      [class]="badgeClasses()">
      <span class="w-2 h-2 rounded-full animate-pulse shrink-0" [class]="dotClass()"></span>
      {{ badgeLabel() }}
    </div>
    <p class="text-slate-600 text-sm font-medium mt-2 leading-relaxed">{{ risk().description }}</p>
  </div>
</div>
