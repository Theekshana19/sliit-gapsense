<div class="flex flex-wrap gap-3">
  <button
    type="button"
    class="inline-flex items-center gap-2 px-5 py-2.5 bg-slate-200/90 text-slate-900 font-semibold rounded-xl hover:bg-slate-300/90 transition-colors"
    (click)="onExportPdf()">
    <span class="material-symbols-outlined text-[20px]">download</span>
    Export PDF
  </button>
  <button
    type="button"
    class="inline-flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-blue-700 to-blue-800 text-white font-semibold rounded-xl shadow-lg shadow-blue-900/20 hover:scale-[0.98] transition-transform active:scale-95"
    (click)="onShareReport()">
    <span class="material-symbols-outlined text-[20px]">share</span>
    Share Report
  </button>
</div>
