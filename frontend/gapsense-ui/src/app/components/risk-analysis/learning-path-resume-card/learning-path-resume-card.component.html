<div class="bg-gradient-to-br from-blue-800 to-blue-900 text-white p-8 rounded-xl shadow-lg flex flex-col justify-center items-start">
  <span class="material-symbols-outlined text-4xl mb-4" style="font-variation-settings: 'FILL' 1">bolt</span>
  <h4 class="text-xl font-bold leading-tight">{{ item().title }}</h4>
  <p class="text-sm opacity-90 mt-2 mb-6">Topic: {{ item().topicName }}</p>
  <button
    type="button"
    class="w-full py-3 bg-white text-blue-800 font-bold rounded-lg hover:opacity-90 transition-all flex items-center justify-center gap-2"
    (click)="continue.emit()">
    {{ item().continueLabel }} <span class="material-symbols-outlined text-sm">arrow_forward</span>
  </button>
</div>
