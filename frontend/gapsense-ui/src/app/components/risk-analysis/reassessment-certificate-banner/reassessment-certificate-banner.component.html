<div class="bg-blue-800 rounded-2xl p-8 flex flex-col md:flex-row items-center justify-between gap-6 overflow-hidden relative shadow-lg">
  <div class="absolute inset-0 bg-gradient-to-r from-blue-800 to-blue-600 opacity-50"></div>
  <div class="relative z-10">
    <h3 class="text-2xl font-extrabold text-white mb-2">{{ config().title }}</h3>
    <p class="text-blue-100 font-medium">{{ config().subtitle }}</p>
  </div>
  <button
    type="button"
    class="relative z-10 px-8 py-4 bg-white text-blue-800 rounded-xl font-bold shadow-xl hover:bg-blue-50 transition-all hover:scale-105 active:scale-95 flex items-center gap-2"
    (click)="generate.emit()">
    {{ config().buttonLabel }}
    <span class="material-symbols-outlined">workspace_premium</span>
  </button>
</div>
