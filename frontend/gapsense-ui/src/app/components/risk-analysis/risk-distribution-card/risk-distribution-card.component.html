<div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200/80 h-full flex flex-col">
  <div class="flex justify-between items-center mb-6">
    <h3 class="text-xl font-bold text-slate-900">Risk Distribution</h3>
    <button type="button" class="p-1.5 rounded-lg hover:bg-slate-100 transition-colors">
      <span class="material-symbols-outlined text-slate-600">more_horiz</span>
    </button>
  </div>
  <div class="flex flex-col lg:flex-row items-center gap-8 flex-1">
    <div class="relative shrink-0 flex-none" style="width: 160px; height: 160px;">
      <svg class="block -rotate-90" width="100%" height="100%" viewBox="-15 -15 150 150" preserveAspectRatio="xMidYMid meet">
        <circle cx="60" cy="60" r="60" fill="none" stroke="#e2e8f0" stroke-width="20" />
        @let segs = distribution().segments;
        @for (seg of segs; track seg.key; let i = $index) {
          @let percentSoFar = segs.slice(0, i).reduce((s, x) => s + x.percent, 0);
          <circle
            cx="60" cy="60" r="60"
            fill="none"
            [attr.stroke]="segmentColor(seg.key)"
            stroke-width="20"
            stroke-linecap="butt"
            [attr.stroke-dasharray]="segmentDashArray(seg.percent)"
            [attr.stroke-dashoffset]="segmentOffset(percentSoFar)" />
        }
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span class="text-2xl font-extrabold text-slate-900">{{ distribution().total }}</span>
        <span class="text-xs font-bold text-slate-600 uppercase">Total</span>
      </div>
    </div>
    <div class="flex-1 space-y-3 w-full">
      @for (seg of distribution().segments; track seg.key) {
        <div class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-2">
            <span
              class="w-3 h-3 rounded-full shrink-0"
              [style.background]="segmentColor(seg.key)"></span>
            <span class="text-sm font-semibold text-slate-800">{{ seg.label }}</span>
          </div>
          <span class="text-sm font-bold text-slate-900">{{ seg.percent }}%</span>
        </div>
      }
    </div>
  </div>
</div>
