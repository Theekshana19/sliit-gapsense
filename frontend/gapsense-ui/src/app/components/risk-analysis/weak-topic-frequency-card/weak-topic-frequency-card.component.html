<div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200/80 h-full flex flex-col">
  <div class="flex justify-between items-center mb-6">
    <h3 class="text-xl font-bold text-slate-900">Weak Topic Frequency</h3>
    <div class="flex rounded-lg overflow-hidden border border-slate-200">
      <button
        type="button"
        class="px-3 py-1.5 text-xs font-bold transition-colors"
        [class.bg-blue-800]="selectedPeriod() === 'week'"
        [class.text-white]="selectedPeriod() === 'week'"
        [class.bg-slate-100]="selectedPeriod() !== 'week'"
        [class.text-slate-600]="selectedPeriod() !== 'week'"
        (click)="periodChange.emit('week')">
        Week
      </button>
      <button
        type="button"
        class="px-3 py-1.5 text-xs font-bold transition-colors"
        [class.bg-blue-800]="selectedPeriod() === 'month'"
        [class.text-white]="selectedPeriod() === 'month'"
        [class.bg-slate-100]="selectedPeriod() !== 'month'"
        [class.text-slate-600]="selectedPeriod() !== 'month'"
        (click)="periodChange.emit('month')">
        Month
      </button>
    </div>
  </div>
  <div class="flex-1 flex gap-2 items-end justify-around min-h-[140px]">
    @for (item of items(); track item.topicName) {
      <div class="flex-1 flex flex-col items-center gap-2 group max-w-[56px]">
        <div class="w-full h-32 flex flex-col justify-end">
          <div
            class="w-full max-w-[36px] mx-auto bg-blue-800 rounded-t transition-all group-hover:bg-blue-700 min-h-[4px]"
            [style.height.%]="barHeightPercent(item)"></div>
        </div>
        <span class="text-[10px] font-semibold text-slate-600 text-center leading-tight truncate w-full" [title]="item.topicName">
          {{ item.topicName.split(' ')[0] }}
        </span>
      </div>
    }
  </div>
  <div class="mt-6">
    <app-risk-insight-card [insight]="insight()" />
  </div>
</div>
