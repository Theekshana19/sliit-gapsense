<div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200/80">
  <div class="flex justify-between items-center mb-8">
    <h3 class="text-xl font-bold text-slate-900">Assessment Trajectory</h3>
    <div class="flex gap-2">
      <button
        type="button"
        class="w-8 h-8 rounded-full border border-slate-300 flex items-center justify-center hover:bg-slate-100 transition-colors disabled:opacity-40"
        [disabled]="!canNavigatePrev()"
        (click)="navigatePrev.emit()">
        <span class="material-symbols-outlined text-sm">chevron_left</span>
      </button>
      <button
        type="button"
        class="w-8 h-8 rounded-full border border-slate-300 flex items-center justify-center hover:bg-slate-100 transition-colors disabled:opacity-40"
        [disabled]="!canNavigateNext()"
        (click)="navigateNext.emit()">
        <span class="material-symbols-outlined text-sm">chevron_right</span>
      </button>
    </div>
  </div>
  <div class="overflow-x-auto">
    <table class="w-full text-left min-w-[600px]">
      <thead>
        <tr class="border-b border-slate-200 text-slate-600 text-sm font-semibold">
          <th class="pb-4 font-bold">Assessment</th>
          <th class="pb-4 font-bold">Date</th>
          <th class="pb-4 font-bold">Score</th>
          <th class="pb-4 font-bold">Outcome</th>
          <th class="pb-4 font-bold">Trend</th>
        </tr>
      </thead>
      <tbody class="text-sm font-medium">
        @for (row of items(); track row.id) {
          <tr class="hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-0">
            <td class="py-6 text-slate-900">{{ row.assessmentName }}</td>
            <td class="py-6 text-slate-600">{{ row.date }}</td>
            <td class="py-6 font-bold text-slate-900">{{ row.score }}</td>
            <td class="py-6">
              <span
                class="px-3 py-1 rounded-full text-xs font-bold"
                [class]="outcomeBadgeClass(row.outcome)">
                {{ outcomeLabel(row.outcome) }}
              </span>
            </td>
            <td class="py-6 flex items-center gap-1" [class]="trendClass(row.trendDirection)">
              <span class="material-symbols-outlined text-lg">
                {{ row.trendDirection === 'up' ? 'trending_up' : 'trending_down' }}
              </span>
              {{ row.trendPercent }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
