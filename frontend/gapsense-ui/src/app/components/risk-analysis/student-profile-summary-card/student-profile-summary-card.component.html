<section class="bg-white p-8 rounded-xl shadow-sm border border-slate-200/80 flex flex-col items-center text-center h-full">
  <div class="relative mb-6">
    <div class="w-32 h-32 rounded-full p-1 bg-gradient-to-tr from-blue-800 to-blue-600 overflow-hidden">
      @if (summary().avatarUrl) {
        <img
          [src]="summary().avatarUrl"
          alt="Student avatar"
          class="w-full h-full rounded-full object-cover border-4 border-white" />
      } @else {
        <div class="w-full h-full rounded-full bg-slate-200 flex items-center justify-center">
          <span class="material-symbols-outlined text-5xl text-slate-500">person</span>
        </div>
      }
    </div>
    <div class="absolute bottom-0 right-0 bg-blue-800 text-white p-2 rounded-full border-4 border-white">
      <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1">verified</span>
    </div>
  </div>
  <h2 class="text-2xl font-bold text-slate-900">{{ summary().fullName }}</h2>
  <p class="text-slate-600 font-medium">{{ summary().studentId }} • {{ summary().yearSemesterText }}</p>
  <div class="mt-8 w-full space-y-4">
    <div class="flex justify-between items-center p-4 bg-slate-100 rounded-xl">
      <span class="text-slate-600 text-sm font-semibold">Module</span>
      <span class="text-blue-800 font-bold text-sm">{{ summary().module }}</span>
    </div>
    <div class="flex justify-between items-center p-4 bg-slate-100 rounded-xl">
      <span class="text-slate-600 text-sm font-semibold">Attendance</span>
      <span class="text-slate-900 font-bold text-sm">{{ summary().attendance }}</span>
    </div>
    <div class="flex justify-between items-center p-4 bg-slate-100 rounded-xl">
      <span class="text-slate-600 text-sm font-semibold">Status</span>
      <span
        class="px-3 py-1 text-xs font-bold rounded-full"
        [class]="statusBadgeClass(summary().status)">
        {{ statusLabel(summary().status) }}
      </span>
    </div>
  </div>
</section>
