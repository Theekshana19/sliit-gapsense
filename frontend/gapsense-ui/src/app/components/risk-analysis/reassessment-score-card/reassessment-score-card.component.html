<div
  class="bg-white p-8 rounded-xl relative overflow-hidden group border border-slate-200/80 shadow-sm">
  <div
    class="absolute top-0 right-0 w-32 h-32 rounded-full -mr-16 -mt-16 transition-transform group-hover:scale-110"
    [class.bg-red-100/40]="summary().isHighRisk"
    [class.bg-blue-100/30]="!summary().isHighRisk"></div>
  <div class="flex justify-between items-start mb-6 relative z-10">
    <div>
      <span
        class="inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest mb-4"
        [class]="labelPillClass()">
        {{ summary().label }}
      </span>
      <h2 class="text-2xl font-bold text-slate-900 mb-1">{{ summary().title }}</h2>
      <p class="text-slate-600 text-sm">Session Date: {{ summary().sessionDate }}</p>
    </div>
    <div
      class="px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-1"
      [class]="riskBadgeClass()">
      <span class="material-symbols-outlined text-sm" [attr.style]="!summary().isHighRisk ? 'font-variation-settings: \'FILL\' 1' : null">
        {{ riskIcon() }}
      </span>
      {{ summary().riskBadge }}
    </div>
  </div>
  <div class="flex items-baseline gap-2 mb-4 relative z-10">
    <span
      class="text-7xl font-extrabold"
      [class.text-slate-900]="summary().isHighRisk"
      [class.text-blue-800]="!summary().isHighRisk">
      {{ summary().scorePercent }}%
    </span>
    <span class="text-slate-600 font-medium">/ 100%</span>
  </div>
  <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden relative z-10">
    <div
      class="h-full rounded-full"
      [class.bg-red-600]="summary().isHighRisk"
      [class.bg-gradient-to-r]="!summary().isHighRisk"
      [class.from-blue-800]="!summary().isHighRisk"
      [class.to-blue-600]="!summary().isHighRisk"
      [style.width.%]="summary().scorePercent"></div>
  </div>
</div>
