<div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200/80 flex flex-col justify-between relative overflow-hidden">
  <div class="relative z-10">
    <div class="flex justify-between items-end mb-4">
      <div>
        <span class="text-blue-800 font-bold text-xs uppercase tracking-widest">{{ summary().label }}</span>
        <h3 class="text-5xl font-extrabold text-slate-900 mt-1">{{ summary().readinessPercent }}%</h3>
      </div>
      <div class="text-right">
        <span class="text-slate-600 font-semibold block text-sm">{{ summary().nextMilestoneLabel }}</span>
        <span class="text-slate-900 font-bold">{{ summary().nextMilestoneName }}</span>
      </div>
    </div>
    <div class="w-full bg-slate-200 h-4 rounded-full overflow-hidden">
      <div
        class="bg-gradient-to-r from-blue-800 to-blue-600 h-full rounded-full transition-all"
        [style.width.%]="summary().readinessPercent"></div>
    </div>
    <p class="mt-4 text-sm text-slate-600">{{ summary().helperText }}</p>
  </div>
  <div class="absolute -right-16 -top-16 w-48 h-48 bg-blue-800/5 rounded-full blur-3xl pointer-events-none"></div>
</div>
