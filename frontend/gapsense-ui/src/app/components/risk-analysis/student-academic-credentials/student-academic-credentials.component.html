<div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200/80 h-full">
  <h3 class="text-lg font-bold text-slate-900 mb-6">Academic Credentials</h3>
  <div class="grid grid-cols-2 gap-4">
    @for (c of credentials(); track c.id) {
      <div
        class="flex flex-col items-center p-4 rounded-xl bg-slate-100 text-center transition-opacity"
        [class.opacity-40]="c.inactive">
        <span
          class="material-symbols-outlined text-3xl mb-2"
          [class]="c.iconColorClass ?? 'text-slate-600'"
          [class.text-slate-400]="c.inactive">
          {{ c.icon }}
        </span>
        <span
          class="text-xs font-bold"
          [class.text-slate-900]="!c.inactive"
          [class.text-slate-500]="c.inactive">
          {{ c.label }}
        </span>
      </div>
    }
  </div>
</div>
