<div class="lg:w-2/3">
  <span
    class="inline-block mb-3 px-3 py-1 bg-blue-800 text-white text-[10px] font-bold rounded-full uppercase tracking-tighter">
    {{ insight().badgeLabel }}
  </span>
  <h2 class="text-2xl font-extrabold text-slate-900 mb-4">{{ insight().title }}</h2>
  <p class="text-slate-600 text-base leading-relaxed mb-6">
    {{ insight().explanation }}
  </p>
  <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
    @for (m of insight().metrics; track m.label) {
      <div class="p-4 bg-white/80 backdrop-blur-sm rounded-2xl border border-slate-200/60">
        <div class="text-2xl font-bold text-blue-800">{{ m.value }}</div>
        <div class="text-xs font-medium text-slate-600">{{ m.label }}</div>
      </div>
    }
  </div>
</div>
