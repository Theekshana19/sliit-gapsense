<div
  class="group bg-white rounded-2xl overflow-hidden shadow-sm flex flex-col md:flex-row border border-slate-200/80 hover:border-blue-800/20 transition-all">
  <div class="w-full md:w-40 bg-slate-100 flex-shrink-0 relative min-h-[120px] md:min-h-0">
    @if (recommendation().imageUrl) {
      <img
        [src]="recommendation().imageUrl"
        [alt]="recommendation().imageAlt ?? ''"
        class="w-full h-full object-cover" />
    } @else {
      <div class="w-full h-full flex items-center justify-center text-slate-400">
        <span class="material-symbols-outlined text-5xl">landscape</span>
      </div>
    }
    <div class="absolute inset-0 bg-blue-900/10 group-hover:bg-transparent transition-colors pointer-events-none"></div>
  </div>
  <div class="p-6 flex flex-col justify-between flex-1">
    <div>
      <div class="flex justify-between items-center mb-2">
        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">
          {{ recommendation().topicLabel }}
        </span>
        <span
          class="text-[10px] font-bold px-2 py-0.5 bg-blue-100 text-blue-900 rounded-full">
          MEDIUM
        </span>
      </div>
      <h3 class="text-lg font-bold text-slate-900 mb-2">{{ recommendation().title }}</h3>
      <p class="text-sm text-slate-600 mb-4">{{ recommendation().description }}</p>
    </div>
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-slate-600 text-base">{{ recommendation().resourceTypeIcon }}</span>
        <span class="text-xs font-semibold text-slate-700">{{ recommendation().resourceTypeLabel }}</span>
      </div>
      <button
        type="button"
        class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 transition-colors"
        (click)="onOpenResource()">
        <span class="material-symbols-outlined text-blue-800 text-xl">open_in_new</span>
      </button>
    </div>
  </div>
</div>
