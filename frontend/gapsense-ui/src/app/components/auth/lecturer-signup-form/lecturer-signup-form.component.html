<form class="space-y-6 max-w-xl" [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-auth-step-badge stepText="Step 2 of 2" contextLabel="Lecturer Profile" />

  <div>
    <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Create Lecturer Account</h1>
    <p class="text-slate-600 font-medium mt-2 text-sm md:text-base">
      Please provide your institutional credentials and specialization.
    </p>
  </div>

  <app-auth-input
    inputId="lec-fullname"
    label="Full Name"
    placeholder="Dr. Jane Smith"
    icon="person"
    autocomplete="name"
    [control]="form.controls.fullName" />

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <app-auth-input
      inputId="lec-email"
      label="Email Address"
      placeholder="jane.s@sliit.lk"
      type="email"
      icon="mail"
      autocomplete="email"
      [control]="form.controls.email" />
    <app-auth-input
      inputId="lec-staff"
      label="Staff ID"
      placeholder="SLIIT-L-XXXX"
      icon="badge"
      autocomplete="off"
      [control]="form.controls.staffId" />
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <app-auth-select
      selectId="lec-dept"
      label="Department"
      placeholder="Select Department"
      icon="corporate_fare"
      [options]="authUi.departmentOptions"
      [control]="form.controls.department" />
    <app-auth-input
      inputId="lec-spec"
      label="Specialization"
      placeholder="e.g. Machine Learning"
      icon="lightbulb"
      autocomplete="off"
      [control]="form.controls.specialization" />
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="space-y-3">
      <app-auth-password-input
        inputId="lec-pass"
        label="Password"
        icon="lock"
        autocomplete="new-password"
        [control]="form.controls.password" />
      <app-password-strength-bar
        [segmentsFilled]="strengthSegments()"
        label="Strength"
        [statusText]="'Strength: ' + strengthLabel()"
        hint="Add symbols for extra security." />
    </div>
    <app-auth-password-input
      inputId="lec-pass2"
      label="Confirm Password"
      icon="lock_reset"
      autocomplete="new-password"
      [control]="form.controls.confirmPassword" />
  </div>

  @if (passwordMismatch()) {
    <p class="text-xs font-semibold text-red-600">Passwords do not match.</p>
  }

  <div class="flex flex-col sm:flex-row sm:items-center gap-4 pt-2">
    <div class="sm:flex-1 w-full">
      <app-auth-button type="submit" label="Complete Registration" [showArrow]="true" [disabled]="form.invalid" />
    </div>
    <a routerLink="/auth/signup" class="text-sm font-semibold text-slate-600 hover:text-blue-800">Go Back</a>
  </div>
</form>

<p class="text-xs text-slate-500 mt-6 max-w-xl leading-relaxed">
  By clicking &quot;Complete Registration&quot;, you agree to SLIIT&apos;s
  <a href="#" class="font-bold text-blue-800 hover:underline">Academic Integrity Policy</a>
  and
  <a href="#" class="font-bold text-blue-800 hover:underline">Data Protection Terms</a>.
</p>
