<a
  [routerLink]="link()"
  class="group flex items-center gap-4 rounded-2xl border border-slate-200/80 bg-slate-100/80 p-5 md:p-6 shadow-sm hover:border-blue-300 hover:bg-white hover:shadow-md transition-all text-left">
  <span
    class="material-symbols-outlined text-3xl text-blue-800 shrink-0 w-12 h-12 flex items-center justify-center rounded-xl bg-white border border-slate-200/80 group-hover:bg-blue-50">
    {{ icon() }}
  </span>
  <div class="flex-1 min-w-0">
    <p class="font-bold text-slate-900 text-base">{{ title() }}</p>
    <p class="text-sm text-slate-600 mt-0.5 leading-snug">{{ description() }}</p>
  </div>
  <span class="material-symbols-outlined text-slate-400 group-hover:text-blue-800 transition-colors shrink-0">chevron_right</span>
</a>
